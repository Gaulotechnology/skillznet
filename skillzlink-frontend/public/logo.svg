<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <!-- Zimbabwe Flag Gradients -->
    <linearGradient id="logoGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A843"/>
      <stop offset="100%" stop-color="#007A30"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="logoRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="logoDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ── Logo Emblem (Left) ── -->
  <g transform="translate(6, 6)">
    <!-- Background rounded icon container -->
    <rect x="0" y="0" width="68" height="68" rx="18" fill="url(#logoDark)"/>
    <rect x="0" y="0" width="68" height="68" rx="18" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <!-- Interconnected 'S' monogram -->
    <g filter="url(#logoShadow)">
      <!-- Top Green Loop -->
      <path d="M21 21 C 21 14, 47 12, 47 21 C 47 28, 21 28, 21 36" fill="none" stroke="url(#logoGreen)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Middle Gold Connector -->
      <path d="M24 27 C 30 25, 40 25, 45 33 C 48 37, 48 43, 48 50" fill="none" stroke="url(#logoGold)" stroke-width="5.5" stroke-linecap="round"/>

      <!-- Bottom Red Loop -->
      <path d="M47 36 C 47 44, 21 44, 21 51 C 21 58, 47 57, 47 50" fill="none" stroke="url(#logoRed)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Connected Nodes -->
      <circle cx="20" cy="21" r="3.5" fill="#FFFFFF"/>
      <circle cx="20" cy="21" r="1.5" fill="#00A843"/>
      
      <circle cx="48" cy="50" r="3.5" fill="#FFFFFF"/>
      <circle cx="48" cy="50" r="1.5" fill="#EF4444"/>

      <!-- Central Node -->
      <circle cx="34" cy="34" r="3" fill="#FFFFFF"/>
      <circle cx="34" cy="34" r="1.5" fill="#FFD600"/>
    </g>
  </g>

  <!-- ── Typography (Right) ── -->
  <g transform="translate(86, 0)">
    <!-- Main Brand Name -->
    <text x="0" y="44" font-family="'Inter', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="900" letter-spacing="-0.8">
      <tspan fill="#0F172A">Skillz</tspan><tspan fill="url(#logoGreen)">N</tspan><tspan fill="url(#logoGold)">e</tspan><tspan fill="url(#logoRed)">t</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="1" y="60" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="1.8">
      DIGITAL TALENT NETWORK
    </text>

    <!-- Zimbabwe Flag Stripe Underline -->
    <g transform="translate(1, 65)">
      <rect x="0" y="0" width="40" height="2.5" rx="1.25" fill="#00A843"/>
      <rect x="43" y="0" width="40" height="2.5" rx="1.25" fill="#FFD600"/>
      <rect x="86" y="0" width="40" height="2.5" rx="1.25" fill="#EF4444"/>
    </g>
  </g>
</svg>
