<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Zimbabwe Flag Color Gradients -->
    <linearGradient id="zwGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A843"/>
      <stop offset="100%" stop-color="#007A30"/>
    </linearGradient>
    <linearGradient id="zwGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="zwRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="zwBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background container circle/squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#zwBlack)"/>
  
  <!-- Subtle inner boundary border -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Stylized Geometric "S" Network Link with Zimbabwe Flag Colors -->
  <g filter="url(#subtleShadow)">
    <!-- Top Green Arc (Top curve of S) -->
    <path d="M40 38 C 40 26, 88 22, 88 38 C 88 50, 40 50, 40 64" fill="none" stroke="url(#zwGreen)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Middle Gold Ribbon / Diagonal Connection -->
    <path d="M44 48 C 54 44, 74 44, 84 58 C 88 64, 88 74, 88 88" fill="none" stroke="url(#zwGold)" stroke-width="10" stroke-linecap="round"/>

    <!-- Bottom Red Arc (Bottom curve of S) -->
    <path d="M88 64 C 88 78, 40 78, 40 90 C 40 104, 88 102, 88 90" fill="none" stroke="url(#zwRed)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- White Peace Accent Dots / Network Nodes -->
    <circle cx="38" cy="38" r="6" fill="#FFFFFF"/>
    <circle cx="38" cy="38" r="2.5" fill="#00A843"/>
    
    <circle cx="90" cy="90" r="6" fill="#FFFFFF"/>
    <circle cx="90" cy="90" r="2.5" fill="#EF4444"/>

    <!-- Central Gold Node -->
    <circle cx="64" cy="64" r="5.5" fill="#FFFFFF"/>
    <circle cx="64" cy="64" r="3" fill="#FFD600"/>
  </g>
</svg>
